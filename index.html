<!DOCTYPE html>
<html>
<script src="Chart.js"></script>
<body style="background-color: black; margin: 0; padding: 0;">
<canvas id="myChart" style="width: 100%; height: 100vh;"></canvas>

<script>
fetch('/time/' + new Date().getTime())
  .then(response => response.text())
  .then(time => {})
  .catch(error => {
    console.error('Error:', error);
});
const ctx = document.getElementById("myChart").getContext("2d");
const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      fill: false,
      lineTension: 0,
      backgroundColor: "rgba(255, 0, 0, 1.0)",
      borderColor: "rgba(255, 255, 255, 0.1)",
      borderWidth: 20,
      pointRadius: 22,
      data: []
    }]
  },
  options: {
    legend: {display: false},
    scales: {
      yAxes: [{
        ticks: {
          min: 60,
          max: 100,
          callback: function(value) {
            return value + "*F";
          },
          fontSize: 32,
          fontColor: "white"
        }
      }],
      xAxes: [{
        ticks: {
          callback: function(value) {
            return value + "s";
          },
          fontSize: 32,
          fontColor: "white"
        }
      }]
    }
  }
});

for (let i = 0; i < 10; i++) {
  chart.data.labels.push(i + 1);
  chart.data.datasets[0].data.push(32) + 3;
}
chart.update();

setInterval(() => {
  //const yValue = Math.floor(Math.random() * 68) + 32;
  var yValue = 32
  fetch('/temp')
  .then(response => response.json())
  .then(sedata => {
    yValue = parseFloat(sedata);
    //alert(yValue);
    if (chart.data.datasets[0].data.length >= 10) {
      chart.data.datasets[0].data.shift();
    }
    chart.data.datasets[0].data.push(parseFloat(sedata));
    chart.update();
  })
  .catch(error => {
    console.error('Error:', error);
  });
}, 1500);
</script>

</body>
</html>
